<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background tile in the toolkit's sepia brown -->
  <rect width="64" height="64" rx="10" fill="#5a4a2c"/>
  <!-- d20 face: a flat-topped hexagon with internal triangle facets -->
  <g stroke="#fdfaf3" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <polygon points="32,7 54,20 54,44 32,57 10,44 10,20" stroke-width="3"/>
    <polygon points="32,21 44,42 20,42" stroke-width="2"/>
    <line x1="32" y1="21" x2="32" y2="7" stroke-width="2"/>
    <line x1="44" y1="42" x2="54" y2="44" stroke-width="2"/>
    <line x1="20" y1="42" x2="10" y2="44" stroke-width="2"/>
    <line x1="44" y1="42" x2="54" y2="20" stroke-width="2"/>
    <line x1="20" y1="42" x2="10" y2="20" stroke-width="2"/>
  </g>
  <!-- "20" tucked inside the central triangle -->
  <text x="32" y="38" font-family="Georgia, serif" font-size="11" font-weight="700"
        text-anchor="middle" fill="#fdfaf3" letter-spacing="0.5">20</text>
</svg>
